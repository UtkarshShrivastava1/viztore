name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Build & Test Monorepo
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/platform-db
      JWT_ACCESS_SECRET: default_ci_test_jwt_access_secret_32_chars
      JWT_REFRESH_SECRET: default_ci_test_jwt_refresh_secret_32_chars
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: test-key
      CLOUDINARY_API_SECRET: test-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Monorepo Build
        run: pnpm build

      - name: Run Test Suites
        run: pnpm test
