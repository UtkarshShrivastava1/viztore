services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viztore-backend
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

